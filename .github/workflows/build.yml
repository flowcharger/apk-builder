name: Build APK

on:
  workflow_dispatch:
    inputs:
      input:
        description: "Zip file or folder to build (path inside the repo). Leave empty to auto-detect project.zip or project/"
        required: false
        default: ""
      variant:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - "project.zip"
      - "project/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache APKForge toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.apkforge/tools
            ~/.apkforge/gradle-home
          key: apkforge-${{ runner.os }}-v1-${{ hashFiles('apkforge.py') }}
          restore-keys: apkforge-${{ runner.os }}-v1-

      - name: Make the preinstalled Android SDK writable
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            sudo chown -R "$USER" "$ANDROID_HOME" || true
          fi

      - name: Build APK with APKForge
        env:
          INPUT_PATH: ${{ inputs.input }}
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          INPUT="$INPUT_PATH"
          if [ -z "$INPUT" ]; then
            if   [ -f project.zip ]; then INPUT=project.zip
            elif [ -d project ];     then INPUT=project
            else
              echo "::error::Add your project as project.zip or a project/ folder (or pass the 'input' path)."
              exit 1
            fi
          fi
          python apkforge.py --cli "$INPUT" --variant "$VARIANT" --out dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
