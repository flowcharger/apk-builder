name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - "project.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack APKForge
        run: |
          if [ ! -f apkforge.py ]; then
            unzip -q -o APKForge.zip
            cp APKForge/apkforge.py APKForge/ui.html .
          fi

      - name: Check project.zip exists
        run: |
          test -f project.zip || { echo "::error::Upload your app as project.zip to the repo root."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.apkforge/tools
            ~/.apkforge/gradle-home
          key: apkforge-${{ runner.os }}-v1-${{ hashFiles('apkforge.py') }}
          restore-keys: apkforge-${{ runner.os }}-v1-

      - name: Make Android SDK writable
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            sudo chown -R "$USER" "$ANDROID_HOME" || true
          fi

      - name: Build APK from project.zip
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: python apkforge.py --cli project.zip --variant "$VARIANT" --out dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
